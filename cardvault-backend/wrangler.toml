name = "cardvault-backend"
main = "src/index.ts"
compatibility_date = "2024-02-22"

[[d1_databases]]
binding = "DB"
database_name = "cardvault-db"
database_id = "ab83b85a-45fb-41cf-9302-c87e71cfad48" # Replace with real ID from Cloudflare dashboard

[[r2_buckets]]
binding = "CARD_IMAGES"
bucket_name = "cardvault-images"

# Environment variables / secrets
# Set the Gemini key as a Cloudflare Worker secret (never commit it here):
#   npx wrangler secret put GEMINI_API_KEY
# Get a free key at: https://aistudio.google.com/app/apikey
